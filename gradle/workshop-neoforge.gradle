neoForge {
    version = workshopTarget.loader_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}
dependencies { implementation mcphoneCoordinate }
