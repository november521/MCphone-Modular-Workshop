import groovy.json.JsonSlurper

def repositoryRoot = file('../..')
def identity = new Properties()
new File(repositoryRoot, 'gradle.properties').withInputStream { identity.load(it) }
identity.each { key, value -> project.ext.set(key.toString(), value.toString()) }

def parser = new JsonSlurper()
def targets = parser.parse(new File(repositoryRoot, 'versions/targets.json'))
def targetId = projectDir.name
def target = targets[targetId]
if (!target || target.project != "platforms/${targetId}") {
    throw new GradleException("Unknown platform: ${targetId}")
}
def upstream = parser.parse(new File(repositoryRoot, 'versions/upstream.lock.json'))
ext.workshopTarget = target
ext.workshopTargetId = targetId
ext.mcphoneVersion = upstream.version
ext.mcphoneCoordinate = "com.november.mcphone:mcphone:${upstream.version}-${targetId}"

version = mod_version
group = mod_group_id
base.archivesName = artifact_name
java.toolchain.languageVersion = JavaLanguageVersion.of(target.java as int)

sourceSets.main.java.srcDir(new File(repositoryRoot, 'shared/src/main/java'))
sourceSets.main.resources.srcDir(new File(repositoryRoot, 'shared/src/main/resources'))
// A standalone verification main, not a JUnit suite. Reuse the main Minecraft classpath lazily:
// ModDevGradle attaches the game dependency after this shared script is applied.
def menuTests = sourceSets.create('menuTest') {
    java.srcDir(new File(repositoryRoot, 'shared/src/test/java'))
    compileClasspath = files(sourceSets.main.output, providers.provider { sourceSets.main.compileClasspath })
    runtimeClasspath = files(output, sourceSets.main.output, providers.provider { sourceSets.main.runtimeClasspath })
}
def layers = parser.parse(new File(repositoryRoot, 'versions/layers.json'))
target.layers.each { name ->
    def layer = layers[name]
    if (!layer) throw new GradleException("Unknown layer: ${name}")
    def category = layer.since && layer.loader ? 'both' : layer.since ? 'version' : 'loader'
    def folder = new File(repositoryRoot, "layers/${category}/${name}")
    if (!folder.isDirectory()) throw new GradleException("Missing layer: ${folder}")
    sourceSets.main.java.srcDir(new File(folder, 'src/main/java'))
    sourceSets.main.resources.srcDir(new File(folder, 'src/main/resources'))
}

repositories {
    maven {
        name = 'LockedMCphone'
        url = new File(repositoryRoot, '.cache/maven').toURI()
        content { includeGroup('com.november.mcphone') }
    }
    mavenCentral()
}

def replacements = new LinkedHashMap(identity)
replacements.putAll([
    minecraft_version: target.minecraft,
    java_version: target.java,
    loader_version: target.loader_version,
    loader_range: target.loader_range ?: '',
    fml_range: target.fml_range ?: '',
    mcphone_version: upstream.version
])
tasks.named('processResources', ProcessResources).configure {
    inputs.properties(replacements)
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'fabric.mod.json']) {
        expand(replacements)
    }
}
tasks.named('jar', Jar).configure {
    archiveClassifier = targetId
    from(new File(repositoryRoot, 'LICENSE'))
    manifest.attributes('Implementation-Version': mod_version, 'Workshop-Target': targetId)
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.register('testPortableMenus', JavaExec) {
    description = 'Check the anvil world-effect guard and independent workstation identities.'
    dependsOn(tasks.named(menuTests.classesTaskName))
    classpath = menuTests.runtimeClasspath
    mainClass = 'com.november.mcphone.workshop.menu.PortableMenuTest'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(target.java as int) }
}
tasks.named('check').configure { dependsOn(tasks.named('testPortableMenus')) }
