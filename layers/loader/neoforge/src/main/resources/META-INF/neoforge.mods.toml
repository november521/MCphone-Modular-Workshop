modLoader="javafml"
loaderVersion="${fml_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/november521/MCphone-Modular-Workshop/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Vanilla workstations as installable MCphone modules. Architecture scaffold; gameplay is not implemented yet.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${loader_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mcphone"
type="required"
versionRange="[${mcphone_version}]"
ordering="AFTER"
side="BOTH"
