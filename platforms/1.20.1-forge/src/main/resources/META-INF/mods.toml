modLoader="javafml"
loaderVersion="${fml_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/november521/MCphone-Modular-Workshop/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''Installable MCphone workstation modules. Portable crafting table, smithing table, anvil and stonecutter Apps.'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${loader_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mcphone"
mandatory=true
versionRange="[${mcphone_min_version},)"
ordering="AFTER"
side="BOTH"
